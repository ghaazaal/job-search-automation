# config.yaml — Job Hunt Automation
# API keys are NEVER stored here — set via environment variables:
#   PowerShell:  $env:APIFY_TOKEN = "apify_api_..."
#                $env:ANTHROPIC_API_KEY = "sk-ant-..."
# This file is safe to commit. Add to .gitignore: output/, *.db, .env

search:
  # 30, not 7. Measured: the same search over a 7-day window reached 4 of
  # the aggregator's 10 boards and found 0 roles open to an Armenian user;
  # over 30 days it reached 9 and found 7. We Work Remotely, RemoteOK,
  # Working Nomads, Hacker News and DevITjobs US were not empty - they post
  # infrequently enough that a week hid them entirely. The narrow window,
  # not the source list, was the binding constraint.
  days_posted: 30
  jobs_per_category: 50
  run_timeout: 120
  # Per-company cap on the watched-company fetch; the LinkedIn rung's
  # batched call sends limit = this x company count.
  watched_jobs_per_company: 25

apify:
  linkedin_actor:       "valig~linkedin-jobs-scraper"
  remote_boards_actor:  "flash_scraper~remote-job-aggregator"
  company_actor:        "curious_coder~linkedin-company-scraper"
  # Resolves a domain to its Greenhouse/Lever/Ashby/Workable/etc. board
  # and returns normalized jobs. The `ats` rung of the company watchlist.
  careers_actor:        "fabro.dev~company-career-page-jobs"

scoring:
  bands:
    strong: 8
    partial: 5

company_filter:
  reject_stages: ["enterprise"]
  min_growth_score: 4
  cache_ttl_days: 7
  reject_keywords_in_company_name: ["Consulting", "Staffing", "Recruiting", "Staffing Agency"]

tailoring:
  min_score: 6
  shortlist_score: 7       # minimum score for LLM decision layer

output_dir: "output/"
tracker_path: "../job_tracker.xlsx"

# Company enrichment — Apify company scraper + LLM intel (stage, headcount, growth score)
# Disabled by default while the core scrape→score→tailor pipeline stabilises.
# Set enabled: true to re-activate once the core pipeline is stable.
company_enrichment:
  enabled: false

# LLM provider configuration
# Provider and model can also be overridden at runtime via environment variables:
#   LLM_PROVIDER=groq
#   LLM_MODEL=llama-3.3-70b-versatile
llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  # provider: "anthropic"          # anthropic | groq | gemini
  # model:    "claude-sonnet-4-6"  # leave blank to use the provider's default

# Learning path (LEARN tab, or `python main.py --learning-path`).
# Always Claude, whatever llm.provider says: it reads every stored posting
# for the skills it asks for, compares them with your resume, and writes
# one path. Needs ANTHROPIC_API_KEY in job_hunt/.env or your shell.
# Each posting is read once and remembered, so only the first analysis
# reads the whole store; later ones read just the new postings.
learning_path:
  days: 30            # only postings from the past N days; 0 = all stored
  model: "claude-opus-5-5"        # compares with your resume, writes the path
  # Reads every posting for skills: ~95% of the cost. Each skill it names
  # must quote the posting, so a cheaper reader mostly risks MISSING a
  # skill, not inventing one.
  read_model: "claude-sonnet-5-5"
  # Send the reading through Claude's Batch API: half price, but answered
  # in minutes to an hour instead of right away. Only used when at least
  # batch_min_postings are unread (the first run, or after a big scrape).
  batch: true
  batch_min_postings: 50
  # First full read of ~1,100 postings, estimated:
  #   sonnet + batch ~$4-5 · opus + batch ~$9-10 · haiku ~$0.50
  #   sonnet, no batch ~$9-11 · opus, no batch ~$18-21
  workers: 4          # parallel requests when not batching
  top_gaps: 12        # how many ranked gaps the path is built from

# Resume tailoring (RESUME tab, and TAILOR RESUME on any role).
# Always Claude, whatever llm.provider says. One call builds the master
# resume from your uploaded resumes (~$0.10-0.30, rarely repeated); one
# call per tailored resume (~$0.10-0.20 with Opus). Tailoring may reorder,
# trim and reword the master, never add to it, and every line is checked
# against the master afterwards. Needs ANTHROPIC_API_KEY in job_hunt/.env.
resume_tailoring:
  model: "claude-opus-5-5"
