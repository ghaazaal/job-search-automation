# vocabulary.yaml — language and market facts, not personal preferences.
#
# What a person is good at lives in their resume. This file holds only what is
# true regardless of who is searching: how seniority is worded in job titles,
# which tools the market names, which employment constraints rule a posting
# out, and the point values the scorer spends.

# Words that carry no signal when comparing a target role to a job title.
# Seniority words are here on purpose: seniority is scored separately, so a
# target role of "Senior Data Engineer" should still match a "Data Engineer"
# posting on the title and let the seniority rule decide the rest.
stopwords:
  - the
  - and
  - for
  - with
  - our
  - you
  - your
  - job
  - role
  - new
  - senior
  - junior
  - staff
  - principal
  - lead
  - entry
  - intern
  - associate
  - head
  - chief

seniority:
  senior_keywords: ["senior", "sr.", "sr ", "staff", "principal", "lead",
                    "manager", "director", "head of", "vp ", "vice president"]
  junior_keywords: ["junior", "jr.", "jr ", "intern", "entry", "associate ",
                    "analyst i ", "engineer i "]
  exec_keywords:   ["vp ", "vice president", "director", "head of", "executive"]

# Technology commonly named in job posts. Two jobs: anything here that appears
# in a description but is not on the resume is reported as a gap, and the
# ratio of named-to-yours drives the mismatch penalty below.
#
# The second block is what the deleted `legacy_tech` and `frontend_tech`
# penalty lists used to name. They are market facts — these tools exist and
# get named in postings — so they belong here. Whether any of them counts
# against you is now decided by the ratio rule, not by a hardcoded verdict
# that React is bad.
market_tools:
  - snowflake
  - databricks
  - bigquery
  - redshift
  - looker
  - spark
  - kafka
  - dagster
  - prefect
  - fivetran
  - terraform
  - kubernetes
  - docker
  - scala
  - java
  - "aws"
  - "gcp"
  - azure
  - sigma
  - segment
  - snowpark
  - airbyte
  - react
  - angular
  - vue
  - ruby
  - rails
  - ios
  - android
  - php
  - salesforce
  - sharepoint
  - cobol
  - mainframe
  - coldfusion

# Fires when a posting names plenty of tooling and almost none of it is yours.
# Replaces the old hardcoded legacy_tech/frontend_tech lists, which only made
# sense for a data person — a ratio lands hard on a React posting for someone
# whose stack is dbt, and softly on the same posting for a React developer.
# The floor exists so a posting naming two tools cannot be judged on a sample
# that small.
mismatch:
  min_tools:  4
  hard_ratio: 0.25
  hard_value: 20
  soft_ratio: 0.5
  soft_value: 10

# Employment constraints. These rule a posting out whatever your skills are.
penalties:
  "w2 only":    15
  clearance:    30
  secret:       30
  cpt:          20
  opt:          20
  exec_penalty: 10
  geo_restricted: 30   # a stated country restriction is the same class of blocker as clearance
  wrong_board:    10   # softer: results from Indeed's us fallback carry uncertainty, not a stated restriction
  mode_mismatch:  15   # says hybrid/on-site, the user searched remote-only, and the place could not be parsed

# Point values. Kept here rather than in code so the weights can be tuned
# without a commit to src/. These are seeds, not findings — validating them
# against real outcomes is what the `event` table is for.
title_scores:
  exact:       40
  all_tokens:  25
  some_tokens: 15
  none:        5

seniority_scores:
  same:      20
  one_apart: 12
  far:       4

skill_scores:
  core:    5
  working: 2
  cap:     20

# Geography. How postings phrase who they can hire — restriction templates,
# phrases that introduce a list of eligible countries, and region
# membership. Market/language facts only — the user's own country lives in
# their profile, never here.
#
# YAML 1.1 gotcha: a bare `no:` (Norway) or `on:` parses as a boolean.
# Quote any country code YAML would eat: `"no":`, `"on":`.
eligibility:
  countries:            # code -> names as postings write them; the FIRST name is the display name rendered in reason sentences
    am: [armenia]
    us: [us, usa, u.s., united states]
    gb: [uk, united kingdom, britain, england]
    ca: [canada]
    au: [australia]
    nz: [new zealand]
    de: [germany]
    fr: [france]
    nl: [netherlands, holland]
    be: [belgium]
    lu: [luxembourg]
    ie: [ireland]
    es: [spain]
    it: [italy]
    pt: [portugal]
    pl: [poland]
    cz: [czech republic, czechia]
    sk: [slovakia]
    ro: [romania]
    bg: [bulgaria]
    gr: [greece]
    hu: [hungary]
    hr: [croatia]
    si: [slovenia]
    rs: [serbia]
    ee: [estonia]
    lv: [latvia]
    lt: [lithuania]
    se: [sweden]
    dk: [denmark]
    fi: [finland]
    "no": [norway]      # quoted — a bare `no:` is YAML for False
    ch: [switzerland]
    at: [austria]
    cy: [cyprus]
    mt: [malta]
    ua: [ukraine]
    by: [belarus]
    ge: [georgia]       # also a US state: a flag fired on the state still reads right, but a user whose own country is ge gets US-state mentions wrongly self-exempted — accepted, documented risk
    az: [azerbaijan]
    kz: [kazakhstan]
    tr: [turkey]
    il: [israel]
    ae: [uae, united arab emirates, dubai]
    sa: [saudi arabia]
    eg: [egypt]
    ng: [nigeria]
    ke: [kenya]
    za: [south africa]
    in: [india]
    pk: [pakistan]
    bd: [bangladesh]
    lk: [sri lanka]
    sg: [singapore]
    my: [malaysia]
    id: [indonesia]
    ph: [philippines]
    vn: [vietnam]
    th: [thailand]
    jp: [japan]
    kr: [south korea, korea]
    cn: [china]
    mx: [mexico]
    br: [brazil]
    ar: [argentina]
    co: [colombia]
  # Names that collide with ordinary English words. In list windows they
  # only count when written with the article ("the us"), and a bare
  # occurrence poisons that window's exclusion claim — we cannot tell the
  # country from the pronoun. Restriction templates are exempt: their
  # surrounding text ("us citizens only") disambiguates on its own.
  ambiguous_names: [us]
  # For parsing stored location strings ("New York, NY" -> us). Two-letter
  # state codes; none collide with YAML booleans today, and the guard test
  # keeps it that way.
  us_states: [al, ak, az, ar, ca, co, ct, de, fl, ga, hi, id, il, in, ia,
              ks, ky, la, me, md, ma, mi, mn, ms, mo, mt, ne, nv, nh, nj,
              nm, ny, nc, nd, oh, ok, or, pa, ri, sc, sd, tn, tx, ut, vt,
              va, wa, wv, wi, wy, dc]
  # Full state names for suffix-free US formats ("Austin, Texas").
  # `georgia` is deliberately ambiguous with the country — handled in code.
  us_state_names: [alabama, alaska, arizona, arkansas, california, colorado,
                   connecticut, delaware, florida, georgia, hawaii, idaho,
                   illinois, indiana, iowa, kansas, kentucky, louisiana,
                   maine, maryland, massachusetts, michigan, minnesota,
                   mississippi, missouri, montana, nebraska, nevada,
                   "new hampshire", "new jersey", "new mexico", "new york",
                   "north carolina", "north dakota", ohio, oklahoma, oregon,
                   pennsylvania, "rhode island", "south carolina",
                   "south dakota", tennessee, texas, utah, vermont,
                   virginia, washington, "west virginia", wisconsin, wyoming]
  templates:            # restriction phrasings; {country} is the slot
    - "must be based in {country}"
    - "must reside in {country}"
    - "based in {country} only"
    - "be located in {country}"
    - "authorized to work in {country}"
    - "eligible to work in {country}"
    - "work authorization in {country}"
    - "{country} citizens only"
    - "{country} residents only"
  list_phrases:         # introduce a list of eligible countries/regions
    - "open to candidates in"
    - "open to applicants in"
    - "eligible countries"
    - "we can hire in"
    - "able to hire in"
    - "available to candidates in"
  anywhere_words: [worldwide, anywhere, globally]
  # Standalone statements of worldwide hiring. These open no list window —
  # the phrase itself is the evidence. Only worldwide-anchored phrasings
  # belong here: bare "work from anywhere" is excluded on purpose, because
  # "work from anywhere in the US" narrows it and would read wrong.
  # Candidate-scoped phrasings only — phrases describing the company
  # ("we are a worldwide remote company", "we hire globally") must not
  # settle eligibility: they say where the company operates, not who it
  # will hire, and each has been seen sitting right next to a stated
  # restriction ("... worldwide remote company. US citizens only.").
  eligible_phrases:
    - "open to candidates worldwide"
    - "open to applicants worldwide"
    - "candidates from anywhere in the world"
    - "work from anywhere in the world"
    - "anywhere in the world"
  # Regions are eligible-only evidence: membership marks the user eligible;
  # absence stays silent, never flags exclusion — membership is fuzzy at
  # the edges and a wrong exclusion would be fabricated precision.
  regions:
    - names: [emea]
      # Corporate EMEA reliably includes the Caucasus.
      codes: [am, ge, az, gb, ie, de, fr, nl, be, lu, es, it, pt, pl, cz,
              sk, ro, bg, gr, hu, hr, si, rs, ee, lv, lt, se, dk, fi,
              "no", ch, at, cy, mt, ua, by, kz, tr, il, ae, sa, eg, ng,
              ke, za]
    - names: [europe]
      # Deliberately no `am`, `ge`, `az`, `tr` — whether the Caucasus or
      # Turkey is "Europe" depends on the writer. Silence beats a wrong
      # eligibility claim.
      codes: [gb, ie, de, fr, nl, be, lu, es, it, pt, pl, cz, sk, ro, bg,
              gr, hu, hr, si, rs, ee, lv, lt, se, dk, fi, "no", ch, at,
              cy, mt, ua, by]
    - names: [european union, eu]
      # The EU-27 exactly — no gb, no ch, no "no".
      codes: [ie, de, fr, nl, be, lu, es, it, pt, pl, cz, sk, ro, bg, gr,
              hu, hr, si, ee, lv, lt, se, dk, fi, at, cy, mt]
    - names: [apac, asia pacific, asia-pacific]
      # Includes South Asia (in, pk, bd, lk) — corporate APAC usually does.
      codes: [au, nz, in, sg, jp, kr, cn, ph, id, vn, th, my, pk, bd, lk]
    - names: [north america]
      codes: [us, ca, mx]
    - names: [americas]
      codes: [us, ca, mx, br, ar, co]
    - names: [latam, latin america]
      codes: [mx, br, ar, co]

# How postings phrase the way a role is worked. Phrases only, never bare
# words: bare "hybrid" fires on "hybrid cloud", bare "remote" on "remote
# teams", bare "on-site" on "on-site gym". Every entry must be
# role-anchored. Language facts only — whether a mode suits the user
# lives in their profile.
# Reviewed out: "no remote work" (…experience required), "office-based"
# (…clients), "hybrid model" (ML term), "in-office days" (…are optional),
# "on-site only" / "onsite only" (…gym access, …parking — amenity noise,
# not a role-mode claim).
work_mode:
  remote_phrases:
    - "fully remote"
    - "100% remote"
    - "remote position"
    - "remote role"
    - "remote-first"
    - "remote-only"
    - "work remotely"
    - "work from home"
    - "work from anywhere"
    - "telecommute"
    - "location: remote"  # JD header line; rescues perks-list "hybrid work options" via conflict→None
    - "work setup & shift: remote"  # BPO JD-header idiom
    - "work setup: remote"  # BPO JD-header idiom
  hybrid_phrases:
    - "hybrid work"
    - "hybrid role"
    - "hybrid working"
    - "hybrid position"
    - "hybrid schedule"
    - "days per week in the office"
    - "days a week in the office"
    - "work setup & shift: hybrid"  # BPO JD-header idiom
    - "work setup: hybrid"  # BPO JD-header idiom
  onsite_phrases:
    - "on-site role"
    - "onsite role"
    - "on-site position"
    - "onsite position"
    - "in-office role"
    - "must work onsite"
    - "onsite work required"
    - "work setup & shift: onsite"  # BPO JD-header idiom
    - "work setup: onsite"  # BPO JD-header idiom

# Which titles name a data role at all. Title-only, phrases only, never
# bare words: a bare "data" matched "Data Center & Edge Infrastructure
# Lead" and "Urban Data Platforms"; a bare "analyst" matched
# "Quantitative Analyst". All three reached the live map.
#
# These are market facts — the names these roles go by. Nothing here
# describes a particular person; which of them a given user searches for
# comes from their resumes.
roles:
  include:
    - "data analyst"
    - "data engineer"
    - "data analytics"
    - "data scientist"
    - "analytics engineer"
    - "business intelligence"
    - "bi developer"
    - "bi analyst"
    - "bi engineer"
    - "power bi"
    - "product analyst"
    - "analytics manager"
    - "data warehouse"
    - "etl developer"
    - "reporting analyst"
    - "insights analyst"
    - "data platform"
  exclude:
    # Traps that pass an include phrase but are not the job.
    # Plural forms listed explicitly, same as everywhere else in this
    # file (see work_mode's "on-site role" / "onsite role") — word-
    # bounded matching does not stem, so the singular alone misses
    # "Data Centers", which is the more common form in the wild (both
    # live-store data-centre titles pulled were plural).
    - "data center"
    - "data centers"
    - "data centre"
    - "data centres"
    - "data entry"
    - "data protection"
    - "clinical data"
    - "flight data"

# Remote boards publish reach as a FIELD rather than burying it in
# prose. These are the shapes measured on a live run:
#   "Anywhere in the World" / "Europe, North America, Latin America,
#   APAC" / "Time zone: CET (+/- 3 hours)" / "United States"
# `location_scope.py` reads this section for worldwide phrases and the
# timezone tables. Region membership is NOT duplicated here — it reads
# `eligibility.regions` above instead, because that table already
# encodes a considered, reviewed judgment call (e.g. the Caucasus and
# Turkey are deliberately left out of "Europe" but included in "EMEA" —
# see its comment) and a second, differently-shaped region table in
# this section previously reversed that call by accident. One
# canonical region table, one place to edit it. The bare-country-name
# fallback also reuses `eligibility.countries`, so there is exactly one
# spelling of every country in the product.
location_scope:
  worldwide:
    - "anywhere in the world"
    - "worldwide"
    - "work from anywhere"
  # The bare word, which is worldwide ONLY when the field names nowhere
  # else. Remotive and Jobicy publish it alone, so it has to be read —
  # but listed above with the certain phrases it matched first and won
  # outright, and "Anywhere in the United States" (a live value, and
  # exactly the US-only posting rule 6d exists to exclude) came back
  # open to an Armenian user. Checked last instead, after a named
  # country or region has had its say.
  worldwide_unqualified:
    - "anywhere"
  # Anchor zone -> UTC offset, for "CET (+/- 3 hours)" style bands.
  timezone_anchors:
    cet: 1
    cest: 2
    utc: 0
    gmt: 0
    est: -5
    pst: -8
  # UTC offset per country, for the timezone-band check. Only countries
  # a user can select today plus the common remote markets.
  #
  # These are STANDARD-TIME offsets, and several countries here observe
  # DST for part of the year (the US, Canada, the EU countries, Turkey
  # does not currently but has flip-flopped). This table does not track
  # that, so a country mid-DST is read at its standard offset, off by an
  # hour for part of the year. A timezone band this parser checks is a
  # wide "+/- N hours" span (commonly 3 or more), so a single hour of
  # drift rarely moves a posting across the open/closed line — but it
  # is a real, accepted limitation, not a rounding error we can promise
  # away.
  #
  # A SEPARATE and coarser limitation: a country spanning multiple real
  # UTC offsets is collapsed here to ONE representative number, not a
  # range — `us: -5` is Eastern time only, but the US actually runs from
  # UTC-5 to UTC-10; `ca: -5` is similarly just its eastmost zone against
  # a real range of -3.5 to -8; `au: 10` ignores Western Australia's
  # UTC+8; `br: -3` ignores Amazonas/Acre further west; `mx: -6` ignores
  # its Pacific states. A user physically in a different zone within one
  # of these countries is compared against the wrong number, potentially
  # by several hours — enough on a narrow "+/- N hour" band to flip a
  # verdict in either direction, not just round it. Accepted for now
  # because there is no per-region signal to disambiguate against in
  # this field; a future fix would need the user's zone, not just their
  # country.
  country_utc_offset:
    am: 4
    ge: 4
    us: -5
    ca: -5
    gb: 0
    de: 1
    fr: 1
    es: 1
    pl: 1
    ua: 2
    tr: 3
    ae: 4
    in: 5
    sg: 8
    au: 10
    br: -3
    mx: -6
    za: 2
