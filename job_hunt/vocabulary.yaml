# vocabulary.yaml — language and market facts, not personal preferences.
#
# What a person is good at lives in their resume. This file holds only what is
# true regardless of who is searching: how seniority is worded in job titles,
# which tools the market names, which employment constraints rule a posting
# out, and the point values the scorer spends.

# Words that carry no signal when comparing a target role to a job title.
# Seniority words are here on purpose: seniority is scored separately, so a
# target role of "Senior Data Engineer" should still match a "Data Engineer"
# posting on the title and let the seniority rule decide the rest.
stopwords:
  - the
  - and
  - for
  - with
  - our
  - you
  - your
  - job
  - role
  - new
  - senior
  - junior
  - staff
  - principal
  - lead
  - entry
  - intern
  - associate
  - head
  - chief

seniority:
  senior_keywords: ["senior", "sr.", "sr ", "staff", "principal", "lead",
                    "manager", "director", "head of", "vp ", "vice president"]
  junior_keywords: ["junior", "jr.", "jr ", "intern", "entry", "associate ",
                    "analyst i ", "engineer i "]
  exec_keywords:   ["vp ", "vice president", "director", "head of", "executive"]

# Technology commonly named in job posts. Two jobs: anything here that appears
# in a description but is not on the resume is reported as a gap, and the
# ratio of named-to-yours drives the mismatch penalty below.
#
# The second block is what the deleted `legacy_tech` and `frontend_tech`
# penalty lists used to name. They are market facts — these tools exist and
# get named in postings — so they belong here. Whether any of them counts
# against you is now decided by the ratio rule, not by a hardcoded verdict
# that React is bad.
market_tools:
  - snowflake
  - databricks
  - bigquery
  - redshift
  - looker
  - spark
  - kafka
  - dagster
  - prefect
  - fivetran
  - terraform
  - kubernetes
  - docker
  - scala
  - java
  - "aws"
  - "gcp"
  - azure
  - sigma
  - segment
  - snowpark
  - airbyte
  - react
  - angular
  - vue
  - ruby
  - rails
  - ios
  - android
  - php
  - salesforce
  - sharepoint
  - cobol
  - mainframe
  - coldfusion

# Fires when a posting names plenty of tooling and almost none of it is yours.
# Replaces the old hardcoded legacy_tech/frontend_tech lists, which only made
# sense for a data person — a ratio lands hard on a React posting for someone
# whose stack is dbt, and softly on the same posting for a React developer.
# The floor exists so a posting naming two tools cannot be judged on a sample
# that small.
mismatch:
  min_tools:  4
  hard_ratio: 0.25
  hard_value: 20
  soft_ratio: 0.5
  soft_value: 10

# Employment constraints. These rule a posting out whatever your skills are.
penalties:
  "w2 only":    15
  clearance:    30
  secret:       30
  cpt:          20
  opt:          20
  exec_penalty: 10
  geo_restricted: 30   # a stated country restriction is the same class of blocker as clearance
  wrong_board:    10   # softer: results from Indeed's us fallback carry uncertainty, not a stated restriction

# Point values. Kept here rather than in code so the weights can be tuned
# without a commit to src/. These are seeds, not findings — validating them
# against real outcomes is what the `event` table is for.
title_scores:
  exact:       40
  all_tokens:  25
  some_tokens: 15
  none:        5

seniority_scores:
  same:      20
  one_apart: 12
  far:       4

skill_scores:
  core:    5
  working: 2
  cap:     20

# Geography. How postings phrase who they can hire — restriction templates,
# phrases that introduce a list of eligible countries, and region
# membership. Market/language facts only — the user's own country lives in
# their profile, never here.
#
# YAML 1.1 gotcha: a bare `no:` (Norway) or `on:` parses as a boolean.
# Quote any country code YAML would eat: `"no":`, `"on":`.
eligibility:
  countries:            # code -> names as postings write them
    am: [armenia]
    us: [us, usa, u.s., united states]
    gb: [uk, united kingdom, britain, england]
    ca: [canada]
    au: [australia]
    nz: [new zealand]
    de: [germany]
    fr: [france]
    nl: [netherlands, holland]
    be: [belgium]
    lu: [luxembourg]
    ie: [ireland]
    es: [spain]
    it: [italy]
    pt: [portugal]
    pl: [poland]
    cz: [czech republic, czechia]
    sk: [slovakia]
    ro: [romania]
    bg: [bulgaria]
    gr: [greece]
    hu: [hungary]
    hr: [croatia]
    si: [slovenia]
    rs: [serbia]
    ee: [estonia]
    lv: [latvia]
    lt: [lithuania]
    se: [sweden]
    dk: [denmark]
    fi: [finland]
    "no": [norway]      # quoted — a bare `no:` is YAML for False
    ch: [switzerland]
    at: [austria]
    cy: [cyprus]
    mt: [malta]
    ua: [ukraine]
    by: [belarus]
    ge: [georgia]       # also a US state: a flag fired on the state still reads right, but a user whose own country is ge gets US-state mentions wrongly self-exempted — accepted, documented risk
    az: [azerbaijan]
    kz: [kazakhstan]
    tr: [turkey]
    il: [israel]
    ae: [uae, united arab emirates, dubai]
    sa: [saudi arabia]
    eg: [egypt]
    ng: [nigeria]
    ke: [kenya]
    za: [south africa]
    in: [india]
    pk: [pakistan]
    bd: [bangladesh]
    lk: [sri lanka]
    sg: [singapore]
    my: [malaysia]
    id: [indonesia]
    ph: [philippines]
    vn: [vietnam]
    th: [thailand]
    jp: [japan]
    kr: [south korea, korea]
    cn: [china]
    mx: [mexico]
    br: [brazil]
    ar: [argentina]
    co: [colombia]
  templates:            # restriction phrasings; {country} is the slot
    - "must be based in {country}"
    - "must reside in {country}"
    - "based in {country} only"
    - "be located in {country}"
    - "authorized to work in {country}"
    - "eligible to work in {country}"
    - "work authorization in {country}"
    - "{country} citizens only"
    - "{country} residents only"
  list_phrases:         # introduce a list of eligible countries/regions
    - "open to candidates in"
    - "open to applicants in"
    - "eligible countries"
    - "we can hire in"
    - "able to hire in"
    - "available to candidates in"
  anywhere_words: [worldwide, anywhere, globally]
  # Standalone statements of worldwide hiring. These open no list window —
  # the phrase itself is the evidence. Only worldwide-anchored phrasings
  # belong here: bare "work from anywhere" is excluded on purpose, because
  # "work from anywhere in the US" narrows it and would read wrong.
  # Candidate-scoped phrasings only — phrases describing the company
  # ("we are a worldwide remote company", "we hire globally") must not
  # settle eligibility: they say where the company operates, not who it
  # will hire, and each has been seen sitting right next to a stated
  # restriction ("... worldwide remote company. US citizens only.").
  eligible_phrases:
    - "open to candidates worldwide"
    - "open to applicants worldwide"
    - "candidates from anywhere in the world"
    - "work from anywhere in the world"
    - "anywhere in the world"
  # Regions are eligible-only evidence: membership marks the user eligible;
  # absence stays silent, never flags exclusion — membership is fuzzy at
  # the edges and a wrong exclusion would be fabricated precision.
  regions:
    - names: [emea]
      # Corporate EMEA reliably includes the Caucasus.
      codes: [am, ge, az, gb, ie, de, fr, nl, be, lu, es, it, pt, pl, cz,
              sk, ro, bg, gr, hu, hr, si, rs, ee, lv, lt, se, dk, fi,
              "no", ch, at, cy, mt, ua, by, kz, tr, il, ae, sa, eg, ng,
              ke, za]
    - names: [europe]
      # Deliberately no `am`, `ge`, `az`, `tr` — whether the Caucasus or
      # Turkey is "Europe" depends on the writer. Silence beats a wrong
      # eligibility claim.
      codes: [gb, ie, de, fr, nl, be, lu, es, it, pt, pl, cz, sk, ro, bg,
              gr, hu, hr, si, rs, ee, lv, lt, se, dk, fi, "no", ch, at,
              cy, mt, ua, by]
    - names: [european union, eu]
      # The EU-27 exactly — no gb, no ch, no "no".
      codes: [ie, de, fr, nl, be, lu, es, it, pt, pl, cz, sk, ro, bg, gr,
              hu, hr, si, ee, lv, lt, se, dk, fi, at, cy, mt]
    - names: [apac, asia pacific, asia-pacific]
      # Includes South Asia (in, pk, bd, lk) — corporate APAC usually does.
      codes: [au, nz, in, sg, jp, kr, cn, ph, id, vn, th, my, pk, bd, lk]
    - names: [north america]
      codes: [us, ca, mx]
    - names: [americas]
      codes: [us, ca, mx, br, ar, co]
    - names: [latam, latin america]
      codes: [mx, br, ar, co]
